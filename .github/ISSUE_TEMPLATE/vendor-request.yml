name: Vendor entry request
description: Ask for a vendor to be added to the knowledge base
title: "[vendor] <vendor name>"
labels: ["kb-vendor-request"]
body:
  - type: markdown
    attributes:
      value: |
        Egressa reported an unknown host or package and you would like an entry for it. Sources
        are welcome but not required — we will do the sourcing.
  - type: input
    id: vendor
    attributes:
      label: Vendor name
    validations: { required: true }
  - type: input
    id: host
    attributes:
      label: Host or package detected
      placeholder: telemetry.example.com or @example/sdk
    validations: { required: true }
  - type: textarea
    id: sources
    attributes:
      label: Known documentation links
      description: DPA, sub-processor list, or data residency pages, if you have them.
    validations: { required: false }
