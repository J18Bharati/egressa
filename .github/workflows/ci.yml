name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; the one job that uploads code scanning results asks for more.
permissions:
  contents: read

# A newer push to the same pull request makes the older run moot. Runs on main
# are never cancelled, so a merge is always tested in full.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # Node 20 is the engines floor (>=20.11); 24 is what release.yml uses.
    # Linux only for now: macOS and Windows are off until the suite passes there
    # (TODOS.md, docs/LIMITATIONS.md). The native parser binding breaks silently
    # per platform, so both should come back.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    # A healthy run takes under three minutes. Without this a hung test holds a
    # runner for GitHub's six-hour limit.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No `version:` input: pnpm/action-setup reads packageManager from
      # package.json and refuses to start when the two disagree.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # lint + typecheck + kb:validate + schema:check + test. kb:validate was
      # missing here, and kb-validate.yml only runs on kb/** changes, so a
      # validator regression elsewhere went unseen.
      - run: pnpm verify
      - run: pnpm build

  self-scan:
    # Egressa scans its own repository. Its fixtures deliberately contain
    # vendor references, so this asserts the scan runs and emits valid SARIF,
    # not that the result is empty.
    #
    # A pull request from a fork gets a read-only token, so the upload would fail
    # with a permissions error rather than say anything about the change. The
    # scan itself still runs on the matrix above.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      # upload-sarif reads this workflow run, and a private repository's token
      # cannot without it.
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Scan
        run: node packages/cli/dist/cli.js scan . --format sarif --out egressa.sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: egressa.sarif
          category: egressa
