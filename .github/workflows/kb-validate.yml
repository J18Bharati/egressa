name: Knowledge base

# A separate job so a data error never looks like an engine regression, and a
# first-time contributor adding one vendor gets targeted feedback quickly
# without running the whole engine test suite.
on:
  pull_request:
    paths: ['kb/**']
  push:
    branches: [main]
    paths: ['kb/**']

permissions:
  contents: read

concurrency:
  group: kb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No `version:` input: pnpm/action-setup reads packageManager from
      # package.json and refuses to start when the two disagree.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Validate entries
        run: pnpm kb:validate
      - name: Check claim scope of entries
        run: pnpm vitest run scripts/claims-contract.test.ts
