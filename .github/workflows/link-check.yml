name: Source link check

# Nightly and non-blocking, never in pull-request CI. A flaky network check in
# a contributor's first pull request is how you lose contributors.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    # A scheduled run on a fork would open issues in the fork.
    if: github.repository == 'J18Bharati/egressa'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22 }
      - name: Check every cited source resolves
        id: check
        continue-on-error: true
        run: node scripts/check-links.mjs
      - name: Open an issue when a source has moved
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const body = require('fs').readFileSync('link-report.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Knowledge base: cited sources no longer resolve',
              body,
              labels: ['kb-correction'],
            });
