name: Source link check

# Nightly and non-blocking, never in pull-request CI. A flaky network check in
# a contributor's first pull request is how you lose contributors.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check every cited source resolves
        id: check
        continue-on-error: true
        run: node scripts/check-links.mjs
      - name: Open an issue when a source has moved
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const body = require('fs').readFileSync('link-report.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Knowledge base: cited sources no longer resolve',
              body,
              labels: ['kb-correction'],
            });
