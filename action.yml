name: Adequacy transfer scan
description: >-
  Detects third-party data-egress patterns in source code and their cross-border
  transfer exposure. Does not assess or certify GDPR compliance.
branding:
  icon: globe
  color: blue

inputs:
  path:
    description: Directory to scan
    required: false
    default: '.'
  fail-on:
    description: 'Fail the job at this level: none | note | warning | error'
    required: false
    # Opting in here, rather than in the CLI default, keeps the failure
    # something the user typed rather than something a KB update caused.
    default: 'warning'
  version:
    description: Version of the adequacy package to run. Pin this.
    required: false
    default: 'latest'
  upload-sarif:
    description: Upload results to GitHub code scanning
    required: false
    default: 'true'
  assume-adequacy-lapsed:
    description: 'Model an adequacy lapse, e.g. US:DPF'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Scan
      shell: bash
      run: |
        extra=""
        if [ -n "${{ inputs.assume-adequacy-lapsed }}" ]; then
          extra="--assume-adequacy-lapsed ${{ inputs.assume-adequacy-lapsed }}"
        fi
        npx -y adequacy@${{ inputs.version }} scan "${{ inputs.path }}" \
          --format sarif --out adequacy.sarif $extra
        npx -y adequacy@${{ inputs.version }} scan "${{ inputs.path }}" \
          --fail-on "${{ inputs.fail-on }}" $extra

    - name: Upload SARIF
      if: always() && inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: adequacy.sarif
        category: adequacy
