name: Egressa transfer scan
description: >-
  Detects third-party data-egress patterns in source code and their cross-border
  transfer exposure. Does not assess or certify GDPR compliance.
branding:
  icon: globe
  color: blue

inputs:
  path:
    description: Directory to scan
    required: false
    default: '.'
  fail-on:
    description: 'Fail the job at this level: none | note | warning | error'
    required: false
    # Opting in here, rather than in the CLI default, keeps the failure
    # something the user typed rather than something a KB update caused.
    default: 'warning'
  version:
    description: Version of the egressa package to run. Pin this.
    required: false
    default: 'latest'
  upload-sarif:
    description: Upload results to GitHub code scanning
    required: false
    default: 'true'
  assume-adequacy-lapsed:
    description: 'Model an adequacy lapse, e.g. US:DPF'
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Three steps, in this order, so the upload depends only on a step that
    # succeeded: the SARIF scan, the upload, then the scan that applies the
    # caller's `fail-on`. With the gate inside the first step, the upload ran
    # on the outputs of a step that had just failed.
    - name: Scan
      id: scan
      shell: bash
      # Inputs travel through the environment, never spliced into the script:
      # an expression inside `run:` is pasted into the shell text, so an input
      # containing a quote or `$(...)` would run as code in the caller's job.
      env:
        EGRESSA_PATH: ${{ inputs.path }}
        EGRESSA_VERSION: ${{ inputs.version }}
        EGRESSA_ADEQUACY: ${{ inputs.assume-adequacy-lapsed }}
      run: |
        set -euo pipefail
        # The SARIF is written outside the checkout and the upload is gated on
        # this step saying so. Gating on a file in the workspace let a scanned
        # repository supply its own: a committed egressa.sarif uploaded when the
        # scan crashed, and a committed egressa.sarif/ directory survived `rm -f`.
        sarif="$RUNNER_TEMP/egressa-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.sarif"
        rm -f "$sarif"
        target="$(cd "$EGRESSA_PATH" && pwd)"
        extra=()
        if [ -n "$EGRESSA_ADEQUACY" ]; then
          extra=(--assume-adequacy-lapsed "$EGRESSA_ADEQUACY")
        fi
        # The scanned repository is untrusted input. npm reads a project .npmrc
        # from the working directory, so a `registry=` line in it would redirect
        # this download. Leave the workspace, and name the registry outright.
        cd "$RUNNER_TEMP"
        egressa() { npx -y --registry=https://registry.npmjs.org/ "egressa@${EGRESSA_VERSION}" "$@"; }
        # `${extra[@]+...}` because macOS runners ship bash 3.2, where an empty
        # array under `set -u` is an unbound variable.
        # `--fail-on none`: a committed .egressa.yml `failOn` would otherwise fail
        # this scan, and the caller's `fail-on` input is the only thing that decides.
        egressa scan "$target" --format sarif --out "$sarif" \
          --fail-on none ${extra[@]+"${extra[@]}"}
        echo "sarif=$sarif" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF
      # Needs `security-events: write` on the calling job. Runs only when the
      # scan above succeeded, so a crash is not buried under a second error.
      if: inputs.upload-sarif == 'true' && steps.scan.outputs.sarif != ''
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}
        category: egressa

    - name: Check fail-on
      shell: bash
      # The same rules as the Scan step: inputs through env, run from outside
      # the workspace, registry named outright.
      env:
        EGRESSA_PATH: ${{ inputs.path }}
        EGRESSA_VERSION: ${{ inputs.version }}
        EGRESSA_FAIL_ON: ${{ inputs.fail-on }}
        EGRESSA_ADEQUACY: ${{ inputs.assume-adequacy-lapsed }}
      run: |
        set -euo pipefail
        target="$(cd "$EGRESSA_PATH" && pwd)"
        extra=()
        if [ -n "$EGRESSA_ADEQUACY" ]; then
          extra=(--assume-adequacy-lapsed "$EGRESSA_ADEQUACY")
        fi
        cd "$RUNNER_TEMP"
        egressa() { npx -y --registry=https://registry.npmjs.org/ "egressa@${EGRESSA_VERSION}" "$@"; }
        egressa scan "$target" --fail-on "$EGRESSA_FAIL_ON" ${extra[@]+"${extra[@]}"}
